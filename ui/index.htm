<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind AI Chat UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
      }
    </style>
    <style>
      /* Custom scrollbar for better looks */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-slate-50 h-screen flex flex-col">
    <header
      class="bg-white border-b p-4 flex justify-between items-center shadow-sm"
    >
      <h1 class="text-xl font-bold text-blue-600">AI Assistant</h1>
      <span
        class="text-xs text-green-500 font-medium bg-green-50 px-2 py-1 rounded-full border border-green-200"
        >Online</span
      >
    </header>
    <!-- Chat Window -->
    <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="flex justify-start">
        <div
          class="max-w-[80%] bg-white border border-slate-200 text-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm"
        >
          Hello! How can I help you today?
        </div>
      </div>
    </main>
    <div id="typing-indicator" class="hidden px-4 py-2">
      <div class="flex items-center space-x-2">
        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div>
        <div
          class="w-2 h-2 bg-slate-400 rounded-full animate-bounce [animation-delay:-.3s]"
        ></div>
        <div
          class="w-2 h-2 bg-slate-400 rounded-full animate-bounce [animation-delay:-.5s]"
        ></div>
      </div>
    </div>

    <footer class="bg-white border-t p-4 flex flex-col gap-2">
      <div
        class="agent-trigger-container flex gap-2 items-center"
        id="agent-trigger-container"
      ></div>
      <div class="w-full mx-auto flex gap-2 items-center">
        <button
          class="bg-blue-200/20 hover:bg-blue-200/50 active:bg-blue-200/50 rounded-full w-8 h-8 transition-all"
          id="view-trigger-btns"
        >
          <i class="fa-solid fa-plus text-blue-600"></i>
        </button>
        <form id="chat-form" class="w-full flex gap-2">
          <input
            type="text"
            id="user-input"
            placeholder="Type your message..."
            class="flex-1 border border-slate-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            autocomplete="off"
          />
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-full w-10 h-10 flex items-center justify-center transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-5 h-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"
              />
            </svg>
          </button>
        </form>
      </div>
    </footer>
    <script type="module" src="./index.js"></script>
  </body>
</html>
